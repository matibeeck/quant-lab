name: paper-trade
on:
  schedule:
    - cron: "45 14 * * 1-5"   # 14:45 UTC = 16:45 Milán en horario de verano (ajustar a "45 15" en noviembre)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebalancear hoy aunque no sea el primer día hábil del mes"
        type: boolean
        default: false
jobs:
  rebalance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [MOM6, VOLT, DUAL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r paper/requirements.txt
      - run: python paper_trade.py --strategy ${{ matrix.strategy }} ${{ inputs.force && '--force' || '' }}
        working-directory: paper
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_API_KEY_VOLT: ${{ secrets.ALPACA_API_KEY_VOLT }}
          ALPACA_SECRET_KEY_VOLT: ${{ secrets.ALPACA_SECRET_KEY_VOLT }}
          ALPACA_API_KEY_DUAL: ${{ secrets.ALPACA_API_KEY_DUAL }}
          ALPACA_SECRET_KEY_DUAL: ${{ secrets.ALPACA_SECRET_KEY_DUAL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.strategy }}
          path: paper/logs/
          if-no-files-found: ignore
